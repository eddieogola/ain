services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./server/src:/app
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: server/requirements.server.txt
        - action: rebuild
          path: server/Dockerfile.server
        - action: restart
          path: server/src
        - action: restart
          path: server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ain-network
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - llm
      - embedding-model

  llm:
    provider:
      type: model
      options:
        model: ai/gemma3
        runtime_flags:
          - "--ctx-size"
          - "32000"
          - "--temp"
          - "0.01"
  embedding-model:
    provider:
      type: model
      options:
        model: ai/embeddinggemma:latest

  client:
    build:
      context: ./server
      dockerfile: Dockerfile.client
    command:
      [
        "streamlit",
        "run",
        "client.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    volumes:
      - ./server/src/client.py:/app/client.py
    develop:
      watch:
        - action: rebuild
          path: server/requirements.client.txt
        - action: rebuild
          path: server/Dockerfile.client
        - action: restart
          path: server/src/client.py
    ports:
      - "8501:8501"
    networks:
      - ain-network
    env_file:
      - ./server/.env

networks:
  ain-network:
    driver: bridge
