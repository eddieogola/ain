[project]
name = "server"
version = "0.1.0"
description = "A server application for African Insights Navigator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "langchain>=0.3.27",
    "langchain-ollama>=0.3.7",
    "langchain-openai>=0.3.33",
    "langgraph>=0.6.7",
    "langgraph-supervisor>=0.0.29",
    "pydantic-settings>=2.10.1",
    "streamlit>=1.49.1",
    "tavily-python>=0.7.11",
    "uvicorn>=0.35.0",
    "dotenv>=0.9.9",
    "langchain-tavily>=0.2.11",
    "langchain-groq>=0.3.8",
    "langchain-xai>=0.2.5",
    "langchain-huggingface>=0.3.1",
    "langchain-google-genai>=2.1.12",
]

[dependency-groups]
dev = [
    "langchain-ollama>=0.3.7",
    "langchain-tavily>=0.2.11",
    "pytest>=8.4.2",
]
